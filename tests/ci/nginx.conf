# nginx + nginx-rtmp for the end-to-end latency test. Mirrors the production
# stream server (fpgas.online-infra roles/cam/stream-server: nginx-rtmp.conf.j2,
# pib.conf.j2, live-hls.conf.j2) -- keep the HLS directives in step with
# pib.conf.j2, they are what sets the latency floor. Runs unprivileged with
# `nginx -p <prefix> -c nginx.conf`; e2e.py substitutes @PREFIX@.
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes 1;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/error.log info;

events { worker_connections 64; }

rtmp_socket_dir @PREFIX@;

rtmp {
  server {
    listen 127.0.0.1:11935;

    application pib {
      allow publish 127.0.0.1;
      deny publish all;
      allow play all;

      live on;
      wait_video on;
      wait_key on;

      hls on;
      hls_path @PREFIX@/hls;
      hls_fragment_naming system;
      # Same values as pib.conf.j2: 900ms (not 1s) so a keyframe every second
      # always closes the fragment despite ms-rounding jitter in timestamps;
      # 8 s window = 8 fragments.
      hls_fragment 900ms;
      hls_playlist_length 8s;
    }
  }
}

http {
  include /etc/nginx/mime.types;
  access_log @PREFIX@/access.log;
  client_body_temp_path @PREFIX@/tmp;
  proxy_temp_path @PREFIX@/tmp;
  fastcgi_temp_path @PREFIX@/tmp;
  uwsgi_temp_path @PREFIX@/tmp;
  scgi_temp_path @PREFIX@/tmp;

  server {
    listen 127.0.0.1:18080;
    root @PREFIX@/www;

    location /live {
      alias @PREFIX@/hls;
      autoindex on;
      # As live-hls.conf.j2: a cached playlist is stale by definition.
      add_header Cache-Control no-cache;
    }
  }
}
