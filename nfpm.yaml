name: fpgas-online-cam
arch: all
platform: linux
version: "${VERSION}"
maintainer: fpgas.online <apt@fpgas.online>
description: Camera capture and GStreamer streaming for fpgas.online Pi boards
license: Apache-2.0
depends:
  - gstreamer1.0-tools
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - libcamera-tools
  # fpgas-cam-lens: python3; dtc for the runtime overlay (dtoverlay itself
  # comes with Raspberry Pi OS); modprobe (kmod) for i2c-dev while it asks
  # the lens chip
  - python3
  - device-tree-compiler
  - kmod
contents:
  - src: cam.sh
    dst: /usr/local/bin/fpgas-cam.sh
    file_info:
      mode: 0755
  - src: gst-libcam.sh
    dst: /usr/local/bin/fpgas-gst-libcam.sh
    file_info:
      mode: 0755
  - src: gst-libcam-yt.sh
    dst: /usr/local/bin/fpgas-gst-libcam-yt.sh
    file_info:
      mode: 0755
  - src: cam-lens.py
    dst: /usr/local/bin/fpgas-cam-lens
    file_info:
      mode: 0755
  - src: af/ov5647.json
    dst: /usr/share/fpgas-online/cam/af/ov5647.json
  - src: cam.service
    dst: /usr/lib/systemd/system/fpgas-cam.service
scripts:
  postinstall: postinstall.sh
